[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nudt5-evidence-audit"
version = "0.1.0"
description = "Reproducibility and chemical-data diagnostics; not a validated inhibitor predictor"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
nudt5-audit = "pipeline:main"
nudt5-controls = "controls:main"
nudt5-transfer = "transfer:main"
nudt5-selectivity = "selectivity:main"
nudt5-assay = "assay:main"
nudt5-structure = "structure_comparison:main"

[tool.setuptools]
py-modules = ["pipeline", "controls", "transfer", "selectivity", "assay", "structure_comparison"]
package-dir = {"" = "scripts/scripts"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt", "requirements-structure.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts/scripts", "scripts"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "EXE"]

[tool.mypy]
python_version = "3.11"
files = ["scripts", "tests"]
strict = true
follow_untyped_imports = true
