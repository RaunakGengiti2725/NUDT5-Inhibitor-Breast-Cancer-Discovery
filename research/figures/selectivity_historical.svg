   <text style="font-size: 14px; font-family: 'DejaVu Sans'" transform="translate(290.459531 24.677813)">Historical original graphs</text>
   <text style="font-size: 14px; font-family: 'DejaVu Sans'" transform="translate(187.068437 40.35475)">Reported paired IC50 ratios versus frozen Equal_mean</text>
  </g>
  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="75.6" y="74.88" transform="rotate(-0 75.6 74.88)">n=6 nonoverlap paired compounds: 3 point ratios, 1 strict bound(s), 2 without a finite ratio bound</text>
  </g>
  <g id="text_28">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(75.6 371.630391)">Filled circles: point ratios of reported means. Open triangles/arrows: strict censoring-derived bounds, not CIs.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(75.6 383.76)">Crosses: both targets &gt;50 µM; any positive R remains possible. Untested and overlapping rows remain in the complete table.</text>
  </g>
  <g id="text_29">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(75.6 401.620781)">Source mean ± SD retained in tables; ratio uncertainty is not estimated without raw paired replicates.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(75.6 413.750391)">Reaction times differ (20/60 min); control normalization and replication ambiguities remain unresolved.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(75.6 425.88)">Single previously inspected publication, related chemistry; not fresh external or prospective validation.</text>
  </g>
